# Application Name
spring.application.name=sportscenter

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/sports-center?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true

# Prevent Hibernate from converting camelCase to snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Optional: Set dialect (can help Hibernate generate optimized SQL for MySQL)
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.format_sql:true


# Redis Config
# ===============
spring.data.redis.host=localhost
spring.data.redis.port=6379